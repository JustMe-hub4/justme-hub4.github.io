<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FHIR Interop Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #07111F; color: #F8FAFC; }
    .container { max-width: 500px; margin: 100px auto; background: #101D2D; padding: 30px; border-radius: 12px; }
    .hidden { display: none; }
    button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #16C7D9; color: #07111F; }
    .btn-secondary { background: #162438; color: #CBD5E1; border: 1px solid #1E334A; }
    input { width: 100%; padding: 10px; background: #162438; border: 1px solid #1E334A; border-radius: 6px; color: white; margin: 8px 0; }
    .key-display { font-family: monospace; background: #162438; padding: 10px; border-radius: 6px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="login-container" class="container">
    <h1>FHIR Interop Engine</h1>
    <p style="color:#94A3B8">HL7v2 → FHIR R4 Translation</p>
    <input type="email" id="login-email" placeholder="Enter your email">
    <button id="btn-login" class="btn-primary" style="width:100%">Send Magic Link</button>
    <p id="login-msg" style="color:#94A3B8; margin-top:12px;"></p>
  </div>

  <div id="dashboard-container" class="container hidden">
    <h2>Dashboard</h2>
    <p>API Key:</p>
    <div class="key-display" id="api-key-display">••••••••••••••••••••••••</div>
    <p>Credits: <strong id="credit-balance">0</strong></p>
    <button onclick="copyKey()" class="btn-secondary">Copy Key</button>
    <button onclick="supabaseClient.auth.signOut()" class="btn-secondary" style="margin-top:12px;">Sign Out</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://lhgfolrupmsklrccirpj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4y3_i7S_YNCgOoEkbbVWRg_qXLBNlyf';
    const API_BASE = 'https://quack-xzno.onrender.com';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let session = null, currentApiKey = '', credits = 0;

    async function fetchProfile() {
      const res = await fetch(`${API_BASE}/portal/me`, { headers: { Authorization: `Bearer ${session.access_token}` } });
      if (res.ok) {
        const d = await res.json();
        credits = d.credits_remaining;
        currentApiKey = d.api_key;
        document.getElementById('credit-balance').textContent = credits;
        document.getElementById('api-key-display').textContent = currentApiKey;
      }
    }

    function copyKey() {
      navigator.clipboard.writeText(currentApiKey);
      alert('API key copied!');
    }

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const btn = document.getElementById('btn-login'); btn.disabled = true; btn.textContent = 'Sending...';
      const { error } = await supabaseClient.auth.signInWithOtp({ email });
      document.getElementById('login-msg').textContent = error ? error.message : 'Check your email!';
      btn.disabled = false; btn.textContent = 'Send Magic Link';
    });

    supabaseClient.auth.onAuthStateChange((event, authSession) => {
      if (authSession) {
        session = authSession;
        document.getElementById('login-container').classList.add('hidden');
        document.getElementById('dashboard-container').classList.remove('hidden');
        fetchProfile();
      } else {
        document.getElementById('login-container').classList.remove('hidden');
        document.getElementById('dashboard-container').classList.add('hidden');
      }
    });

    (async () => {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        session = data.session;
        document.getElementById('login-container').classList.add('hidden');
        document.getElementById('dashboard-container').classList.remove('hidden');
        fetchProfile();
      }
    })();
  </script>
</body>
</html>
