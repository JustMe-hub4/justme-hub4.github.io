<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FHIR Interop Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { background: #07111F; color: #F8FAFC; font-family: sans-serif; }
    .hidden { display: none; }
    .sidebar { width: 176px; background: #101D2D; padding: 20px; }
    .main { flex: 1; padding: 20px; }
    .app { display: flex; min-height: 100vh; }
    .card { background: #101D2D; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="login" class="hidden">
      <input id="email" placeholder="Email">
      <button onclick="login()">Send Magic Link</button>
      <p id="msg"></p>
    </div>
    <div id="dashboard" class="hidden">
      <div class="app">
        <div class="sidebar">
          <h2>FHIR</h2>
          <nav>
            <a href="#" onclick="navigate('dashboard')">Dashboard</a>
            <a href="#" onclick="navigate('billing')">Billing</a>
          </nav>
        </div>
        <div class="main">
          <div id="section-dashboard" class="section active">
            <h2>Dashboard</h2>
            <div class="card" id="credit-card">Credits: <span id="credits">0</span></div>
          </div>
          <div id="section-billing" class="section">
            <h2>Billing</h2>
            <div class="card">Buy credits here.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://lhgfolrupmsklrccirpj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4y3_i7S_YNCgOoEkbbVWRg_qXLBNlyf';
    const API_BASE = 'https://quack-xzno.onrender.com';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let session = null;

    async function init() {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        session = data.session;
        showDashboard();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('login').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      fetchCredits();
    }

    async function fetchCredits() {
      const res = await fetch(`${API_BASE}/portal/me`, {
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
      if (res.ok) {
        const data = await res.json();
        document.getElementById('credits').textContent = data.credits_remaining;
      }
    }

    async function login() {
      const email = document.getElementById('email').value;
      const { error } = await supabase.auth.signInWithOtp({ email });
      document.getElementById('msg').textContent = error ? error.message : 'Check your email!';
    }

    function navigate(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('section-' + section).classList.add('active');
    }

    supabase.auth.onAuthStateChange((event, s) => {
      if (s) { session = s; showDashboard(); }
      else showLogin();
    });

    init();
  </script>
</body>
</html>
