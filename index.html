<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FHIR Interop Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background: #07111F; color: #F8FAFC; }
    .hidden { display: none !important; }
    #login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    #login-box { background: #101D2D; border-radius: 12px; padding: 40px; width: 400px; text-align: center; }
    #dashboard { display: flex; min-height: 100vh; }
    .sidebar { width: 200px; background: #101D2D; padding: 24px; border-right: 1px solid #1E334A; }
    .sidebar h2 { color: #16C7D9; margin-bottom: 24px; }
    .sidebar a { display: block; padding: 10px; color: #94A3B8; text-decoration: none; border-radius: 6px; margin-bottom: 8px; }
    .sidebar a:hover, .sidebar a.active { background: #162438; color: white; }
    .main { flex:1; padding: 24px; }
    .card { background: #101D2D; border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid #1E334A; }
    .btn { padding: 10px 20px; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; }
    .btn-primary { background: #16C7D9; color: #07111F; }
    .btn-danger { background: #EF4444; color: white; }
    .btn-secondary { background: #162438; color: #CBD5E1; border: 1px solid #1E334A; }
    input { width: 100%; padding: 10px; background: #162438; border: 1px solid #1E334A; border-radius: 6px; color: white; margin: 8px 0; }
    .key-display { font-family: monospace; background: #162438; padding: 10px; border-radius: 6px; word-break: break-all; }
    .flex-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  </style>
</head>
<body>
  <!-- LOGIN SECTION (static) -->
  <div id="login-container">
    <div id="login-box">
      <h1>FHIR Interop Engine</h1>
      <p style="color:#94A3B8">HL7v2 → FHIR R4 Translation</p>
      <input type="email" id="login-email" placeholder="Enter your email">
      <button id="btn-login" class="btn btn-primary" style="width:100%; margin-top:12px;">Send Magic Link</button>
      <p id="login-msg" style="color:#94A3B8; margin-top:12px;"></p>
    </div>
  </div>

  <!-- DASHBOARD SECTION (static, hidden by default) -->
  <div id="dashboard" class="hidden">
    <div class="sidebar">
      <h2>FHIR</h2>
      <a href="#" class="active" onclick="switchTab('dashboard')">Dashboard</a>
      <a href="#" onclick="switchTab('billing')">Billing</a>
      <a href="#" onclick="signOut()">Sign Out</a>
    </div>
    <div class="main">
      <!-- Dashboard Tab -->
      <div id="tab-dashboard" class="tab-content">
        <h2>Dashboard</h2>
        <div class="card">
          <strong>Credits:</strong> <span id="credit-balance">0</span>
          <button class="btn btn-primary" onclick="switchTab('billing')" style="margin-left:12px;">Buy Credits</button>
        </div>
        <div class="card">
          <strong>API Key:</strong><br>
          <div class="key-display" id="api-key-display">••••••••••••••••••••••••</div>
          <div class="flex-row">
            <button id="btn-show-key" class="btn btn-secondary" onclick="toggleKey()">Show</button>
            <button class="btn btn-secondary" onclick="copyKey()">Copy</button>
            <button class="btn btn-danger" onclick="rotateKey()">Rotate</button>
          </div>
        </div>
        <div class="card">
          <strong>Invoice History</strong>
          <div id="invoice-list">No invoices yet.</div>
        </div>
      </div>
      <!-- Billing Tab -->
      <div id="tab-billing" class="tab-content hidden">
        <h2>Buy Credits</h2>
        <div class="card">
          <h3>Starter - 100 credits - $30</h3>
          <button class="btn btn-primary" onclick="buyCredits('price_1U1xzUIUjoQtwpInIy0o6u1O')">Buy</button>
        </div>
        <div class="card">
          <h3>Growth - 10,000 credits - $2,000</h3>
          <button class="btn btn-primary" onclick="buyCredits('price_1U1xzUIUjoQtwpInNFq6TRCU')">Buy</button>
        </div>
        <div class="card">
          <h3>Volume - 75,000 credits - $9,000</h3>
          <button class="btn btn-primary" onclick="buyCredits('price_1U1xzUIUjoQtwpInL8G3EBZX')">Buy</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---------- CONFIG ----------
    const SUPABASE_URL = 'https://lhgfolrupmsklrccirpj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4y3_i7S_YNCgOoEkbbVWRg_qXLBNlyf';
    const API_BASE = 'https://quack-xzno.onrender.com';
    const STRIPE_KEY = 'pk_test_51Rop3yIUjoQtwpInfxgeUgbRyoJ3NPDBseT2iRIhrQC3HYhrWPwtR9e8DzLiaj9LFIvb9fgR5xNiuDbrG9gMptKP00e9HvvXNY';

    // ---------- CLIENTS ----------
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let stripe = null;
    if (typeof Stripe !== 'undefined') {
      stripe = Stripe(STRIPE_KEY);
    }

    // ---------- STATE ----------
    let session = null;
    let currentApiKey = '';
    let apiKeyRevealed = false;
    let credits = 0;
    let invoices = [];

    // ---------- HELPERS ----------
    function showError(msg) {
      document.getElementById('login-msg').textContent = msg;
    }

    function showToast(msg, type) {
      alert(msg); // simple for now; we can add a toast later
    }

    function updateCreditDisplay() {
      document.getElementById('credit-balance').textContent = credits.toLocaleString();
    }

    function updateApiKeyDisplay() {
      const el = document.getElementById('api-key-display');
      if (apiKeyRevealed) {
        el.textContent = currentApiKey;
        document.getElementById('btn-show-key').textContent = 'Hide';
      } else {
        el.textContent = currentApiKey.substring(0,12) + '••••••••••••••••••••••••';
        document.getElementById('btn-show-key').textContent = 'Show';
      }
    }

    function toggleKey() {
      apiKeyRevealed = !apiKeyRevealed;
      updateApiKeyDisplay();
    }

    function copyKey() {
      navigator.clipboard.writeText(currentApiKey);
      alert('API key copied!');
    }

    async function fetchProfile() {
      const res = await fetch(`${API_BASE}/portal/me`, {
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
      if (res.ok) {
        const data = await res.json();
        credits = data.credits_remaining;
        currentApiKey = data.api_key;
        updateCreditDisplay();
        updateApiKeyDisplay();
      }
    }

    async function fetchInvoices() {
      const res = await fetch(`${API_BASE}/portal/invoices`, {
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
      if (res.ok) {
        const data = await res.json();
        invoices = data.invoices || [];
        const list = document.getElementById('invoice-list');
        if (invoices.length === 0) {
          list.textContent = 'No invoices yet.';
        } else {
          list.innerHTML = invoices.map(inv => 
            `${new Date(inv.created_at).toLocaleDateString()} - $${(inv.amount_total/100).toFixed(2)} - ${inv.credits_purchased} credits`
          ).join('<br>');
        }
      }
    }

    async function rotateKey() {
      if (!confirm('Deactivate current key? This cannot be undone.')) return;
      const res = await fetch(`${API_BASE}/portal/rotate-key`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
      if (res.ok) {
        const data = await res.json();
        currentApiKey = data.new_api_key;
        apiKeyRevealed = true;
        updateApiKeyDisplay();
        alert('API key rotated!');
      } else {
        alert('Rotation failed.');
      }
    }

    async function buyCredits(priceId) {
      if (!stripe) {
        alert('Payment system not available.');
        return;
      }
      const res = await fetch(`${API_BASE}/portal/create-checkout-session`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ price_id: priceId })
      });
      if (res.ok) {
        const data = await res.json();
        window.location.href = data.url;
      } else {
        alert('Could not start checkout.');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      document.querySelector(`.sidebar a[onclick="switchTab('${tab}')"]`).classList.add('active');
    }

    function signOut() {
      supabaseClient.auth.signOut();
    }

    // ---------- LOGIN ----------
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      const { error } = await supabaseClient.auth.signInWithOtp({ email });
      if (error) {
        showError(error.message);
      } else {
        showError('Magic link sent! Check your email.');
      }
      btn.disabled = false;
      btn.textContent = 'Send Magic Link';
    });

    // ---------- AUTH STATE LISTENER ----------
    supabaseClient.auth.onAuthStateChange((event, authSession) => {
      if (authSession) {
        session = authSession;
        document.getElementById('login-container').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        fetchProfile();
        fetchInvoices();
      } else {
        document.getElementById('login-container').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
      }
    });

    // Check initial session
    (async () => {
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        session = data.session;
        document.getElementById('login-container').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        fetchProfile();
        fetchInvoices();
      }
    })();
  </script>
</body>
</html>
