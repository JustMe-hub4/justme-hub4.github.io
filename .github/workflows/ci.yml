name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile main.py

      - name: Check for whitespace errors
        run: |
          git diff --check HEAD^ HEAD

      - name: Verify environment variables placeholder
        run: |
          grep -q "SUPABASE_URL" main.py && echo "Config exists"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Basic HTML/JS sanity
        run: |
          # Extract <script> content and check for obvious syntax errors with node
          node -e "const fs = require('fs'); const html = fs.readFileSync('index.html','utf8'); const scripts = [...html.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]); scripts.forEach((s,i)=>{ try { new Function(s); } catch(e) { console.error('Script '+i+' error:', e); process.exit(1); } }); console.log('All inline scripts OK');"
